<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0208">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OurStory">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Yıldızlı Mesajlar ⭐</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0208;
            --primary: #ff4b72;
            --mert: #4facfe;
            --gold: #ffd166;
            --border: rgba(255,255,255,0.09);
            --surface: rgba(255,255,255,0.055);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 15% -10%, rgba(255,209,102,0.16), transparent 34%),
                radial-gradient(circle at 92% 8%, rgba(79,172,254,0.12), transparent 30%),
                linear-gradient(180deg, #120711, #0b0208 45%, #080609);
            padding: 18px;
            padding-bottom: 90px;
        }
        .page {
            width: min(680px, 100%);
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: max(72px, calc(env(safe-area-inset-top) + 56px));
            margin-bottom: 20px;
        }
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }
        h1 {
            flex: 1;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0;
        }
        .sub {
            color: rgba(255,255,255,0.62);
            font-size: 0.85rem;
            margin-top: 2px;
        }
        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .star-card {
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035)),
                var(--surface);
            box-shadow: 0 14px 34px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.06);
            cursor: pointer;
        }
        .star-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 9px;
            color: rgba(255,255,255,0.62);
            font-size: 0.78rem;
        }
        .sender {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #fff;
            font-weight: 700;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 12px rgba(255,75,114,0.55);
        }
        .sender.mert .dot {
            background: var(--mert);
            box-shadow: 0 0 12px rgba(79,172,254,0.55);
        }
        .message {
            line-height: 1.5;
            color: rgba(255,255,255,0.9);
            word-break: break-word;
        }
        .photo {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 8px;
        }
        .empty {
            text-align: center;
            color: rgba(255,255,255,0.58);
            border: 1px dashed rgba(255,255,255,0.16);
            border-radius: 18px;
            padding: 42px 20px;
            background: rgba(255,255,255,0.035);
        }
        .empty strong {
            display: block;
            color: #fff;
            font-size: 1.05rem;
            margin-bottom: 6px;
        }
    </style>
    <script src="app-bootstrap.js?v=1" defer></script>
</head>
<body>
    <main class="page">
        <a class="back" href="chat.html">‹</a>
        <header class="header">
            <div>
                <h1>Yıldızlı Mesajlar ⭐</h1>
                <div class="sub">Sakladığın en güzel mesajlar burada</div>
            </div>
        </header>

        <section class="list" id="starred-list">
            <div class="empty"><strong>Yükleniyor...</strong>Mesajlar kontrol ediliyor.</div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1EbNEABIODcVts24HpES1UebXQ4wTifU",
            authDomain: "ayseye-surpriz.firebaseapp.com",
            projectId: "ayseye-surpriz",
            storageBucket: "ayseye-surpriz.firebasestorage.app",
            messagingSenderId: "531177459988",
            appId: "1:531177459988:web:09060a95bea0b06f197201"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentUser = localStorage.getItem('active_player');
        if (!currentUser) window.location.href = 'index.html';

        const list = document.getElementById('starred-list');
        const messagesQuery = query(collection(db, 'chat_messages'), orderBy('timestamp', 'desc'));

        function escapeHTML(value) {
            return String(value || '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[ch]));
        }

        function formatDate(ts) {
            return ts?.toDate?.()
                ? ts.toDate().toLocaleString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                : 'Tarih yok';
        }

        function preview(msg) {
            if (msg.text) return escapeHTML(msg.text).replace(/\n/g, '<br>');
            if (msg.photo) return 'Fotoğraf';
            if (msg.audio) return 'Sesli mesaj';
            return 'Mesaj';
        }

        onSnapshot(messagesQuery, (snap) => {
            const starred = snap.docs
                .map((d) => ({ id: d.id, msg: d.data() }))
                .filter(({ msg }) => msg.starredBy && msg.starredBy[currentUser])
                .filter(({ msg }) => !msg.deletedForAll && !(msg.deletedFor && msg.deletedFor[currentUser]));

            if (!starred.length) {
                list.innerHTML = '<div class="empty"><strong>Henüz yıldızlı mesaj yok</strong>Sohbette bir mesaja basılı tutup yıldızlayabilirsin.</div>';
                return;
            }

            list.innerHTML = starred.map(({ id, msg }) => `
                <article class="star-card" onclick="location.href='chat.html#msg-${id}'">
                    <div class="star-meta">
                        <span class="sender ${msg.sender === 'Mert' ? 'mert' : ''}"><span class="dot"></span>${escapeHTML(msg.sender || 'Bilinmeyen')}</span>
                        <span>⭐ ${formatDate(msg.timestamp)}</span>
                    </div>
                    <div class="message">${preview(msg)}</div>
                    ${msg.photo ? `<img class="photo" src="${msg.photo}" alt="Yıldızlı fotoğraf">` : ''}
                </article>
            `).join('');
        });
    </script>
<script type="module" src="time-tracker.js"></script>
<script type="module" src="presence.js"></script>
</body>
</html>
