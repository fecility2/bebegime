<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0208">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OurStory">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Şans Çarkı 🎡</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff4b72;
            --gold: #ffd166;
            --bg: #0a0208;
            --surface: rgba(255,255,255,0.055);
            --border: rgba(255,255,255,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(ellipse at 30% 0%, rgba(255,75,114,0.2), transparent 50%),
                        radial-gradient(ellipse at 80% 100%, rgba(180,79,255,0.15), transparent 50%),
                        #0a0208;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-nav {
            position: fixed;
            top: max(20px, env(safe-area-inset-top));
            left: 20px;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 999px;
            color: #fff;
            text-decoration: none;
            padding: 10px 16px;
            font-size: 0.88rem;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(255,75,114,0.4);
            margin-bottom: 8px;
        }
        .header p { opacity: 0.65; font-size: 0.95rem; }

        /* Çark */
        .wheel-wrap {
            position: relative;
            width: min(340px, 90vw);
            height: min(340px, 90vw);
            margin: 0 auto 28px;
        }

        #wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 0 6px rgba(255,75,114,0.3),
                        0 0 40px rgba(255,75,114,0.2),
                        0 20px 60px rgba(0,0,0,0.5);
            transition: transform 0.05s;
        }

        /* Ok işareti */
        .wheel-pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid var(--gold);
            filter: drop-shadow(0 4px 8px rgba(255,209,102,0.6));
            z-index: 10;
        }

        /* Merkez butonu */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4b72, #ff8c00);
            border: 4px solid #fff;
            box-shadow: 0 4px 20px rgba(255,75,114,0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            z-index: 10;
            transition: transform 0.2s;
        }
        .wheel-center:active { transform: translate(-50%, -50%) scale(0.9); }
        .wheel-center.spinning { cursor: not-allowed; }

        /* Sonuç kartı */
        .result-card {
            width: min(380px, 95vw);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 22px 24px;
            text-align: center;
            margin-bottom: 24px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .result-emoji { font-size: 2.8rem; }
        .result-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .result-sub { font-size: 0.82rem; opacity: 0.6; }

        /* Özel görev ekleme */
        .custom-section {
            width: min(380px, 95vw);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }
        .custom-section h3 {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .custom-input-row {
            display: flex;
            gap: 8px;
        }
        .custom-input {
            flex: 1;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            padding: 10px 12px;
            outline: none;
        }
        .custom-input::placeholder { color: rgba(255,255,255,0.3); }
        .custom-add-btn {
            background: linear-gradient(135deg, var(--primary), #ff8c00);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .custom-add-btn:active { transform: scale(0.95); }

        .tasks-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .task-chip {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default;
        }
        .task-chip-remove {
            cursor: pointer;
            opacity: 0.5;
            font-size: 0.7rem;
            transition: 0.15s;
        }
        .task-chip-remove:hover { opacity: 1; color: var(--primary); }

        /* Çevir butonu */
        .spin-btn {
            background: linear-gradient(135deg, var(--primary), #ff8c00);
            border: none;
            border-radius: 999px;
            color: #fff;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 16px 48px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(255,75,114,0.45);
            transition: all 0.25s cubic-bezier(0.175,0.885,0.32,1.275);
            margin-bottom: 16px;
        }
        .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,75,114,0.55); }
        .spin-btn:active { transform: scale(0.96); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        @media (max-width: 400px) {
            .header h1 { font-size: 2rem; }
        }
    </style>
    <script src="app-bootstrap.js?v=1" defer></script>
</head>
<body>
    <a href="games.html" class="back-nav">← Oyunlara Dön</a>

    <div class="header">
        <h1>Şans Çarkı 🎡</h1>
        <p>Çarkı çevir, kader karar versin!</p>
    </div>

    <div class="wheel-wrap">
        <div class="wheel-pointer"></div>
        <canvas id="wheel-canvas" width="600" height="600"></canvas>
        <div class="wheel-center" id="wheel-center-btn" onclick="spinWheel()">🎡</div>
    </div>

    <div class="result-card" id="result-card">
        <div class="result-emoji" id="result-emoji">🎡</div>
        <div class="result-text" id="result-text">Çarkı çevir ve ne çıkacağını gör!</div>
    </div>

    <button class="spin-btn" id="spin-btn" onclick="spinWheel()">🎡 Çevir!</button>

    <div class="custom-section">
        <h3>✏️ Görev Ekle / Çıkar</h3>
        <div class="custom-input-row">
            <input type="text" class="custom-input" id="custom-task-input" placeholder="Yeni görev yaz..." maxlength="40">
            <button class="custom-add-btn" onclick="addCustomTask()">Ekle</button>
        </div>
        <div class="tasks-list" id="tasks-list"></div>
    </div>

    <script>
        const DEFAULT_TASKS = [
            { emoji: '🎬', text: 'Film Gecesi', sub: 'Birlikte film izleyin!' },
            { emoji: '🍕', text: 'Yemek Seçimi', sub: 'Bugün sen seçiyorsun!' },
            { emoji: '💆', text: 'Masaj Sırası', sub: 'Karşına masaj yap!' },
            { emoji: '🎮', text: 'Oyun Gecesi', sub: 'Birlikte oyun oynayın!' },
            { emoji: '🌹', text: 'Sürpriz Hediye', sub: 'Sevgilini şaşırt!' },
            { emoji: '📸', text: 'Fotoğraf Çekimi', sub: 'Birlikte selfie zamanı!' },
            { emoji: '🍳', text: 'Yemek Pişir', sub: 'Birlikte mutfağa girin!' },
            { emoji: '💌', text: 'Aşk Mektubu', sub: 'Sevgiliye bir şeyler yaz!' },
            { emoji: '🚶', text: 'Yürüyüş', sub: 'El ele yürüyüşe çıkın!' },
            { emoji: '🎵', text: 'Dans Gecesi', sub: 'Favori şarkıya dans edin!' },
            { emoji: '🌙', text: 'Yıldız Seyret', sub: 'Dışarıda gökyüzüne bakın!' },
            { emoji: '🎲', text: 'Serbest Seçim', sub: 'Sevgilini seçsin!' },
        ];

        const COLORS = [
            '#ff4b72','#ff8c00','#ffd166','#06d6a0',
            '#4facfe','#a855f7','#ec4899','#f97316',
            '#10b981','#3b82f6','#8b5cf6','#ef4444',
        ];

        let tasks = JSON.parse(localStorage.getItem('sans_carki_tasks') || 'null') || [...DEFAULT_TASKS];
        let spinning = false;
        let currentAngle = 0;

        function saveTasks() {
            localStorage.setItem('sans_carki_tasks', JSON.stringify(tasks));
        }

        function renderTasksList() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = tasks.map((t, i) =>
                `<div class="task-chip">${t.emoji} ${t.text}<span class="task-chip-remove" onclick="removeTask(${i})">✕</span></div>`
            ).join('');
        }

        function addCustomTask() {
            const input = document.getElementById('custom-task-input');
            const val = input.value.trim();
            if (!val) return;
            tasks.push({ emoji: '⭐', text: val, sub: 'Özel görev!' });
            saveTasks();
            renderTasksList();
            drawWheel();
            input.value = '';
            if (window.haptic) window.haptic(30);
        }

        function removeTask(idx) {
            if (tasks.length <= 2) { alert('En az 2 görev olmalı!'); return; }
            tasks.splice(idx, 1);
            saveTasks();
            renderTasksList();
            drawWheel();
        }

        // Çark çizimi
        function drawWheel(highlightIdx = -1) {
            const canvas = document.getElementById('wheel-canvas');
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 10;
            const n = tasks.length;
            const arc = (2 * Math.PI) / n;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            tasks.forEach((task, i) => {
                const startAngle = currentAngle + i * arc;
                const endAngle = startAngle + arc;

                // Dilim
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = highlightIdx === i
                    ? '#fff'
                    : COLORS[i % COLORS.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Metin
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = highlightIdx === i ? '#000' : '#fff';
                ctx.font = `bold ${Math.min(22, 280 / n)}px Outfit, sans-serif`;
                ctx.fillText(task.emoji, r - 14, 6);
                ctx.font = `${Math.min(14, 180 / n)}px Outfit, sans-serif`;
                ctx.fillStyle = highlightIdx === i ? '#000' : 'rgba(255,255,255,0.9)';
                const maxLen = Math.max(8, Math.floor(20 - n * 0.5));
                const label = task.text.length > maxLen ? task.text.slice(0, maxLen) + '…' : task.text;
                ctx.fillText(label, r - 44, 6);
                ctx.restore();
            });

            // Merkez daire
            ctx.beginPath();
            ctx.arc(cx, cy, 32, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a0208';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,75,114,0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spinWheel() {
            if (spinning || tasks.length < 2) return;
            spinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('wheel-center-btn').classList.add('spinning');
            if (window.haptic) window.haptic([30, 20, 30]);

            const extraSpins = 5 + Math.floor(Math.random() * 5); // 5-10 tam tur
            const randomAngle = Math.random() * 2 * Math.PI;
            const totalRotation = extraSpins * 2 * Math.PI + randomAngle;
            const duration = 3500 + Math.random() * 1500;
            const startTime = performance.now();
            const startAngle = currentAngle;

            function easeOut(t) {
                return 1 - Math.pow(1 - t, 4);
            }

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                currentAngle = startAngle + totalRotation * easeOut(progress);
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = currentAngle % (2 * Math.PI);
                    spinning = false;
                    document.getElementById('spin-btn').disabled = false;
                    document.getElementById('wheel-center-btn').classList.remove('spinning');
                    showResult();
                }
            }

            requestAnimationFrame(animate);
        }

        function showResult() {
            const n = tasks.length;
            const arc = (2 * Math.PI) / n;
            // Ok yukarıda (−π/2), çark currentAngle kadar dönmüş
            // Hangi dilim okun altında?
            const pointerAngle = -Math.PI / 2;
            let normalized = ((pointerAngle - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            const idx = Math.floor(normalized / arc) % n;
            const task = tasks[idx];

            // Sonuç kartını güncelle
            document.getElementById('result-emoji').textContent = task.emoji;
            document.getElementById('result-text').textContent = task.text;
            document.getElementById('result-card').querySelector('.result-sub')?.remove();
            const sub = document.createElement('div');
            sub.className = 'result-sub';
            sub.textContent = task.sub || '';
            document.getElementById('result-card').appendChild(sub);

            // Kazanan dilimi vurgula
            drawWheel(idx);

            // Konfeti
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.5 },
                colors: ['#ff4b72', '#ffd166', '#4facfe', '#a855f7']
            });

            if (window.haptic) window.haptic([50, 30, 50, 30, 100]);
        }

        // Init
        renderTasksList();
        drawWheel();
    </script>
<script type="module" src="time-tracker.js"></script>
<script type="module" src="presence.js"></script>
</body>
</html>
