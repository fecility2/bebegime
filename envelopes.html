<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0208">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OurStory">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Sürpriz Zarflar 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- OneSignal Push Notification SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script src="onesignal-helper.js"></script>
    
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #background-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a0520 0%, #0a0208 100%);
        }

        .back-nav {
            position: fixed;
            top: 20px; left: 20px;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .header {
            margin-top: 60px;
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(255, 75, 114, 0.5);
            margin-bottom: 15px;
        }

        .header p {
            opacity: 0.8;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .compose-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid var(--primary);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(255, 75, 114, 0.15);
        }

        .compose-container h3 {
            margin-top: 0;
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            font-size: 1.8rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 15px;
            border-radius: 15px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            resize: none;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="datetime-local"] {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 12px 15px;
            border-radius: 15px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            margin-bottom: 20px;
            box-sizing: border-box;
            color-scheme: dark;
        }
        input[type="text"] {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 12px 15px;
            border-radius: 15px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .btn-seal {
            background: linear-gradient(45deg, #ff4b72, #ff8c00);
            border: none;
            color: #fff;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255,75,114,0.3);
        }

        .btn-seal:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,75,114,0.5);
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.5rem; }
        }
    </style>
    <script src="app-bootstrap.js?v=1" defer></script>
</head>
<body>

    <div id="background-canvas"></div>
    <a href="index.html#hub" class="back-nav">← Ana Sayfaya Dön</a>

    <div class="header">
        <h1>Sürpriz Zarflar 💌</h1>
        <p>Geleceğe bıraktığımız sırlar, itiraflar ve aşk sözcükleri...</p>
    </div>

    <div class="compose-container" style="text-align: center;">
        <a href="envelope-archive.html" class="btn-seal" style="max-width: 250px; display: inline-block; text-decoration: none; margin-bottom: 30px; font-size: 1rem; padding: 12px 20px; background: linear-gradient(45deg, #1ed760, #1db954);">Zaman Kapsülü ⏳</a>
        <h3 style="text-align: left;">Yeni Bir Zarf Hazırla 🔒</h3>
        <p style="opacity: 0.8; font-size: 0.95rem; margin-bottom: 15px; text-align: left;">
            Yazdığın mektup mühürlenecek ve seçtiğin tarihe kadar asla açılamayacak.
        </p>
        <input type="text" id="env-title" placeholder="Zarf başlığı (opsiyonel)">
        <textarea id="env-message" placeholder="Gelecekteki ona söylemek istediklerin..."></textarea>
        <label style="display: block; margin-bottom: 8px; opacity: 0.9; font-size: 0.9rem; text-align: left;">Ne zaman açılsın?</label>
        <input type="datetime-local" id="env-time">
        <button class="btn-seal" id="btn-seal" onclick="sendEnvelope()">Mühürle ve Geleceğe Gönder ✨</button>
        <div id="send-status" style="margin-top: 10px; color: #1ed760; display: none; font-weight: bold; text-align: center;">Zarf Mühürlendi! 💌</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFirestore, enableIndexedDbPersistence, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB1EbNEABIODcVts24HpES1UebXQ4wTifU",
            authDomain: "ayseye-surpriz.firebaseapp.com",
            projectId: "ayseye-surpriz",
            storageBucket: "ayseye-surpriz.firebasestorage.app",
            messagingSenderId: "531177459988",
            appId: "1:531177459988:web:09060a95bea0b06f197201"
        };

        var app = initializeApp(firebaseConfig);
        var db = getFirestore(app);
        enableIndexedDbPersistence(db).catch(function(err) {
            console.log('Firebase Offline Persistence Error:', err.code);
        });
        var envRef = collection(db, 'locked_envelopes');

        var currentUser = localStorage.getItem('active_player');
        if (!currentUser) {
            window.location.href = 'index.html';
        }
        
        var receiverUser = (currentUser === 'Ayşe' ? 'Mert' : 'Ayşe');

        window.sendEnvelope = async function() {
            var titleObj = document.getElementById('env-title');
            var msgObj = document.getElementById('env-message');
            var timeObj = document.getElementById('env-time');
            var btn = document.getElementById('btn-seal');
            
            var msg = msgObj.value.trim();
            var timeVal = timeObj.value;

            if (!msg || !timeVal) {
                alert("Lütfen bir mesaj yaz ve açılacağı zamanı seç sevgilim!");
                return;
            }

            var unlockDate = new Date(timeVal).getTime();
            if (unlockDate <= new Date().getTime()) {
                alert("Mühür tarihi gelecekten bir an olmalı!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Mühürleniyor... ⏳";

            await addDoc(envRef, {
                sender: currentUser,
                receiver: receiverUser,
                title: titleObj.value.trim(),
                message: msg,
                unlock_date: unlockDate,
                created_at: serverTimestamp()
            });

            if (window.sendLoveNotification) {
                window.sendLoveNotification("Geleceğe Bir Zarf Mühürlendi! 💌", currentUser + " sana ileride açman için sihirli bir zarf gönderdi...");
            }

            titleObj.value = "";
            msgObj.value = "";
            timeObj.value = "";
            btn.innerText = "Mühürle ve Geleceğe Gönder ✨";
            btn.disabled = false;
            
            var st = document.getElementById('send-status');
            st.style.display = 'block';
            setTimeout(function() { st.style.display = 'none'; }, 3000);
        };

    </script>
<script type="module" src="time-tracker.js"></script>
<script type="module" src="presence.js"></script>
</body>
</html>
