<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Albümümüz 📸</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0208">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4b72;
            --accent-pink: #ff6b9d;
            --accent-purple: #c44569;
            --bg-primary: #0a0208;
            --bg-secondary: #1a0a1a;
            --glass: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0a0208 0%, #1a0a1a 50%, #0f0510 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            padding-bottom: 100px;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            overflow-x: hidden;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0 30px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 75, 114, 0.3);
            border-color: var(--primary);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .header-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Stats Container */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 640px) {
            .stats-container {
                grid-template-columns: 1fr;
            }
        }

        /* Aktivite Paneli */
        .activity-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .activity-panel h3 {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
        }

        .activity-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .activity-stat {
            text-align: center;
        }

        .activity-stat .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-pink);
        }

        .activity-stat .label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Fotoğraf Ekleme */
        .add-photo-section {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 2px dashed rgba(255, 75, 114, 0.4);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-photo-section:hover {
            background: rgba(255, 75, 114, 0.1);
            border-color: var(--primary);
        }

        .add-photo-section .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .add-photo-section p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        #photo-input {
            display: none;
        }

        /* Albüm Grid */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 0 5px;
        }

        @media (max-width: 480px) {
            .album-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }

        /* Polaroid Kart */
        .polaroid-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 12px 12px 50px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            transform: rotate(var(--rotation, 0deg));
        }

        .polaroid-card:nth-child(odd) {
            --rotation: -2deg;
        }

        .polaroid-card:nth-child(even) {
            --rotation: 2deg;
        }

        .polaroid-card:hover {
            transform: rotate(0deg) scale(1.05) translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 75, 114, 0.3);
            z-index: 10;
        }

        .polaroid-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            background: #2a2a2a;
            display: block;
        }

        @media (max-width: 480px) {
            .polaroid-image {
                height: 120px;
            }
        }

        .polaroid-caption {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: #fff;
            text-align: center;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .polaroid-date {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            backdrop-filter: blur(5px);
        }

        .delete-photo {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s;
            z-index: 20;
        }

        .polaroid-card:hover .delete-photo {
            opacity: 1;
        }

        .uploading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Boş Albüm */
        .empty-album {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-album .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            margin: 40px auto;
            position: relative;
        }

        @media (max-width: 480px) {
            .modal-content {
                width: 95%;
                margin: 20px auto;
                padding: 20px;
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: var(--primary);
        }

        .modal-image-container {
            width: 100%;
            max-height: 60vh;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
        }

        .modal-image-container img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
        }

        .modal-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 20px;
            resize: none;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-btn {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: #fff;
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 75, 114, 0.3);
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            margin-left: 10px;
        }

        /* Bildirim */
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: #fff;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 2000;
            transform: translateX(400px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 300px;
            font-size: 0.9rem;
        }

        .notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Geri</a>

    <div class="header">
        <div class="header-icon">📸</div>
        <h1>Albümümüz</h1>
        <p>Aşk dolu anılarımız</p>
    </div>

    <div class="stats-container">
        <div class="activity-panel">
            <h3>⏱️ <span id="current-user-name">Sen</span> - Bugün burada geçirdiğin süre</h3>
            <div class="activity-stats">
                <div class="activity-stat">
                    <div class="value" id="time-spent">0 dk</div>
                    <div class="label">Geçirilen Süre</div>
                </div>
                <div class="activity-stat">
                    <div class="value" id="photo-count">0</div>
                    <div class="label">Fotoğraf</div>
                </div>
                <div class="activity-stat">
                    <div class="value" id="last-visit">-</div>
                    <div class="label">Son Ziyaret</div>
                </div>
            </div>
        </div>

        <div class="activity-panel partner-panel">
            <h3>💕 Ayşe - Partner aktivitesi</h3>
            <div class="activity-stats">
                <div class="activity-stat">
                    <div class="value" id="partner-time-spent">0 dk</div>
                    <div class="label">Geçirilen Süre</div>
                </div>
                <div class="activity-stat">
                    <div class="value" id="partner-photo-count">0</div>
                    <div class="label">Eklediği Foto</div>
                </div>
                <div class="activity-stat">
                    <div class="value" id="partner-last-visit">-</div>
                    <div class="label">Son Ziyaret</div>
                </div>
            </div>
        </div>
    </div>

    <div class="add-photo-section" onclick="document.getElementById('photo-input').click()">
        <div class="icon">📷</div>
        <p>Yeni Fotoğraf Ekle</p>
    </div>
    <input type="file" id="photo-input" accept="image/*" multiple onchange="handlePhotoUpload(event)">

    <div class="album-grid" id="album-grid"></div>

    <div class="empty-album" id="empty-album" style="display: none;">
        <div class="icon">🖼️</div>
        <p>Henüz fotoğraf eklenmemiş</p>
        <p style="font-size: 0.9rem; margin-top: 10px;">İlk fotoğrafınızı ekleyin!</p>
    </div>

    <!-- Modal -->
    <div class="modal" id="photo-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-image-container">
                <img id="modal-image" src="" alt="Fotoğraf">
            </div>
            <textarea class="modal-input" id="modal-caption" rows="3" placeholder="Bu fotoğraf hakkında bir şeyler yaz..."></textarea>
            <div style="text-align: center;">
                <button class="modal-btn modal-btn-primary" onclick="savePhotoDetails()">Kaydet</button>
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Bildirim -->
    <div class="notification" id="notification"></div>

    <!-- Firebase & ImgBB -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script>
        // =================== CONFIG (from diary.html) ===================
        const IMGBB_API_KEY = '7916dd11376f59a547ed252799f1328a';
        
        const firebaseConfig = {
            apiKey: "AIzaSyB1EbNEABIODcVts24HpES1UebXQ4wTifU",
            authDomain: "ayseye-surpriz.firebaseapp.com",
            projectId: "ayseye-surpriz",
            storageBucket: "ayseye-surpriz.firebasestorage.app",
            messagingSenderId: "531177459988",
            appId: "1:531177459988:web:09060a95bea0b06f197201",
            measurementId: "G-2LBSDG1KDB"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // =================== GLOBALS ===================
        let photos = [];
        let currentPhotoIndex = -1;
        let currentUser = localStorage.getItem('active_player') || 'guest';
        let sessionStartTime = Date.now();
        let totalTimeSpent = 0;
        
        // =================== ACTIVITY TRACKING (Aşk Profili ile entegre) ===================
        // Bugünün tarihi
        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }
        
        // Geçirilen süreyi hesapla ve göster
        function trackActivity() {
            const now = Date.now();
            const currentSessionMinutes = Math.floor((now - sessionStartTime) / 60000);
            
            // Toplam süre = Önceki kayıtlı süre + Mevcut oturum süresi
            const totalMinutes = totalTimeSpent + currentSessionMinutes;
            
            // Ekranda göster
            document.getElementById('time-spent').textContent = totalMinutes + ' dk';
            
            // Her dakika Firestore'a kaydet (değişiklik varsa)
            if (currentSessionMinutes > lastSavedSessionMinutes) {
                lastSavedSessionMinutes = currentSessionMinutes;
                saveActivityData(totalMinutes);
            }
        }
        
        let lastSavedSessionMinutes = 0; // Son kaydedilen oturum süresi
        
        async function saveActivityData(totalMinutes = null) {
            if (totalMinutes === null) {
                const currentSessionMinutes = Math.floor((Date.now() - sessionStartTime) / 60000);
                totalMinutes = totalTimeSpent + currentSessionMinutes;
            }
            
            const today = getTodayString();
            const userStatsRef = db.collection('user_stats').doc(currentUser);
            
            try {
                // Aşk Profili'ndeki timeSpent alanını güncelle (album sayfası için)
                await userStatsRef.set({
                    [`timeSpent.album`]: totalMinutes,
                    [`lastActivity.album`]: firebase.firestore.FieldValue.serverTimestamp(),
                    lastVisit: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                
                // Ayrıca albüm_activity koleksiyonuna da kaydet (albüm için özel)
                await db.collection('album_activity').doc(`${currentUser}_${today}`).set({
                    user: currentUser,
                    date: today,
                    timeSpent: totalMinutes,
                    photoCount: photos.length,
                    lastVisit: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                
                console.log('✅ Süre kaydedildi:', totalMinutes, 'dk');
            } catch (error) {
                console.error('❌ Süre kaydedilemedi:', error);
            }
        }
        
        async function loadActivityData() {
            const today = getTodayString();
            
            try {
                // Aşk Profili'nden kullanıcının timeSpent verilerini yükle
                const userStatsDoc = await db.collection('user_stats').doc(currentUser).get();
                
                if (userStatsDoc.exists) {
                    const statsData = userStatsDoc.data();
                    
                    // Bugünün kaydını kontrol et
                    const todayDoc = await db.collection('album_activity').doc(`${currentUser}_${today}`).get();
                    if (todayDoc.exists && todayDoc.data().timeSpent !== undefined) {
                        totalTimeSpent = todayDoc.data().timeSpent;
                    } else {
                        // Bugün için yeni kayıt, önceki toplamı al
                        totalTimeSpent = statsData.timeSpent?.album || 0;
                    }
                    
                    // Ekranda göster (mevcut oturum süresi henüz eklenmedi, sadece kayıtlı süre)
                    document.getElementById('time-spent').textContent = totalTimeSpent + ' dk';
                    
                    // Son ziyaret bilgisi (lastVisit veya lastActivity.album'dan al)
                    let lastVisitTimestamp = statsData.lastVisit;
                    if (!lastVisitTimestamp && statsData.lastActivity?.album) {
                        lastVisitTimestamp = statsData.lastActivity.album;
                    }
                    
                    if (lastVisitTimestamp) {
                        const lastVisit = lastVisitTimestamp.toDate ? 
                            lastVisitTimestamp.toDate() : new Date(lastVisitTimestamp);
                        
                        // Tarih formatla
                        const day = lastVisit.getDate().toString().padStart(2, '0');
                        const month = (lastVisit.getMonth() + 1).toString().padStart(2, '0');
                        const hours = lastVisit.getHours().toString().padStart(2, '0');
                        const minutes = lastVisit.getMinutes().toString().padStart(2, '0');
                        
                        document.getElementById('last-visit').textContent = `${day}/${month} ${hours}:${minutes}`;
                    } else {
                        document.getElementById('last-visit').textContent = 'İlk ziyaret';
                    }
                } else {
                    // İlk ziyaret
                    totalTimeSpent = 0;
                    document.getElementById('last-visit').textContent = 'İlk ziyaret';
                }
                
                // Partner (Ayşe) verilerini yükle
                const partnerId = currentUser === 'Ayşe' ? 'Mert' : 'Ayşe';
                const partnerStatsDoc = await db.collection('user_stats').doc(partnerId).get();
                
                if (partnerStatsDoc.exists) {
                    const partnerData = partnerStatsDoc.data();
                    const partnerTodayDoc = await db.collection('album_activity').doc(`${partnerId}_${today}`).get();
                    
                    let partnerAlbumTime = 0;
                    if (partnerTodayDoc.exists && partnerTodayDoc.data().timeSpent !== undefined) {
                        partnerAlbumTime = partnerTodayDoc.data().timeSpent;
                    } else {
                        partnerAlbumTime = partnerData.timeSpent?.album || 0;
                    }
                    
                    document.getElementById('partner-time-spent').textContent = partnerAlbumTime + ' dk';
                    document.getElementById('partner-photo-count').textContent = partnerData.photoCount || 0;
                    
                    // Partner son ziyaret
                    let partnerLastVisit = partnerData.lastVisit;
                    if (!partnerLastVisit && partnerData.lastActivity?.album) {
                        partnerLastVisit = partnerData.lastActivity.album;
                    }
                    
                    if (partnerLastVisit) {
                        const lastVisitDate = partnerLastVisit.toDate ? 
                            partnerLastVisit.toDate() : new Date(partnerLastVisit);
                        const day = lastVisitDate.getDate().toString().padStart(2, '0');
                        const month = (lastVisitDate.getMonth() + 1).toString().padStart(2, '0');
                        const hours = lastVisitDate.getHours().toString().padStart(2, '0');
                        const minutes = lastVisitDate.getMinutes().toString().padStart(2, '0');
                        document.getElementById('partner-last-visit').textContent = `${day}/${month} ${hours}:${minutes}`;
                    } else {
                        document.getElementById('partner-last-visit').textContent = '-';
                    }
                }
                
                // Kullanıcı adını güncelle
                document.getElementById('current-user-name').textContent = currentUser === 'Ayşe' ? 'Ayşe' : 'Sen';
                
            } catch (error) {
                console.error('Aktivite verileri yüklenemedi:', error);
            }
        }
        
        // =================== PHOTOS ===================
        async function loadPhotos() {
            try {
                // Firestore'dan yükle
                const doc = await db.collection('couple_album').doc(currentUser).get();
                
                if (doc.exists && doc.data().photos) {
                    photos = doc.data().photos;
                } else {
                    // Varsayılan fotoğraflar
                    photos = [
                        {
                            id: 'default_1',
                            url: 'r1.jpg',
                            caption: 'İlk anımız 🌹',
                            date: new Date().toISOString(),
                            isMarketPhoto: true,
                            seller: 'Aşk Marketi',
                            title: 'İlk anımız'
                        },
                        {
                            id: 'default_2',
                            url: 'r2.jpg',
                            caption: 'Romantik akşam 🕯️',
                            date: new Date(Date.now() - 86400000).toISOString(),
                            isMarketPhoto: true,
                            seller: 'Aşk Marketi',
                            title: 'Romantik akşam'
                        },
                        {
                            id: 'default_3',
                            url: 'r3.jpg',
                            caption: 'Sahildeki anımız 🌊',
                            date: new Date(Date.now() - 172800000).toISOString(),
                            isMarketPhoto: true,
                            seller: 'Aşk Marketi',
                            title: 'Sahildeki anımız'
                        }
                    ];
                    await savePhotos();
                }
                
                // Market fotoğraflarını ekle
                await loadMarketPhotos();
                
                updateAlbumDisplay();
                updatePhotoCount();
            } catch (error) {
                console.error('Fotoğraflar yüklenemedi:', error);
                showNotification('Fotoğraflar yüklenemedi', 'error');
            }
        }
        
        async function loadMarketPhotos() {
            try {
                const userDoc = await db.collection('user_inventory').doc(currentUser).get();
                
                if (userDoc.exists && userDoc.data().photos) {
                    const marketPhotos = userDoc.data().photos;
                    
                    marketPhotos.forEach(mp => {
                        const exists = photos.find(p => p.id === mp.id);
                        if (!exists) {
                            photos.push({
                                id: mp.id,
                                url: mp.url || mp.photoUrl,
                                caption: mp.caption || mp.title || 'Aşk Marketi 💝',
                                date: mp.date || new Date().toISOString(),
                                isMarketPhoto: true,
                                seller: mp.seller,
                                title: mp.title
                            });
                        }
                    });
                    
                    await savePhotos();
                }
            } catch (error) {
                console.error('Market fotoğrafları yüklenemedi:', error);
            }
        }
        
        async function savePhotos() {
            try {
                await db.collection('couple_album').doc(currentUser).set({
                    photos: photos,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Local backup
                localStorage.setItem('album_photos_backup', JSON.stringify(photos));
            } catch (error) {
                console.error('Kaydetme hatası:', error);
                // Sadece local'e kaydet
                localStorage.setItem('album_photos_backup', JSON.stringify(photos));
            }
        }
        
        // =================== DISPLAY ===================
        function updateAlbumDisplay() {
            const grid = document.getElementById('album-grid');
            const empty = document.getElementById('empty-album');
            
            if (photos.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            empty.style.display = 'none';
            
            grid.innerHTML = photos.map((photo, index) => {
                const caption = photo.isMarketPhoto 
                    ? `${photo.caption} - ${photo.seller || 'Aşk Marketi'} 💝`
                    : photo.caption;
                
                return `
                    <div class="polaroid-card" onclick="openPhotoModal(${index})">
                        <div class="polaroid-date">${formatDate(photo.date)}</div>
                        ${photo.isUploading ? '<div class="uploading-indicator"><div class="spinner"></div>Yükleniyor...</div>' : ''}
                        <img src="${photo.url}" alt="${caption}" class="polaroid-image" loading="lazy">
                        <div class="polaroid-caption" title="${caption}">${caption}</div>
                        ${!photo.isMarketPhoto ? `<button class="delete-photo" onclick="deletePhoto(event, ${index})">✕</button>` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function updatePhotoCount() {
            document.getElementById('photo-count').textContent = photos.length;
        }
        
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.toLocaleString('tr-TR', { month: 'short' });
            return `${day} ${month}`;
        }
        
        // =================== UPLOAD ===================
        async function handlePhotoUpload(event) {
            const files = Array.from(event.target.files);
            
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                
                const photoId = 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                // Önce local preview
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const newPhoto = {
                        id: photoId,
                        url: e.target.result,
                        caption: 'Yeni anı 📸',
                        date: new Date().toISOString(),
                        isMarketPhoto: false,
                        isUploading: true
                    };
                    
                    photos.unshift(newPhoto);
                    updateAlbumDisplay();
                    showNotification('Fotoğraf yükleniyor... ☁️');
                    
                    // ImgBB'ye yükle
                    try {
                        const formData = new FormData();
                        formData.append('image', file);
                        formData.append('key', IMGBB_API_KEY);
                        formData.append('name', `album_${photoId}`);
                        
                        const response = await fetch('https://api.imgbb.com/1/upload', {
                            method: 'POST',
                            body: formData
                        });
                        
                        const data = await response.json();
                        
                        if (data.success) {
                            const index = photos.findIndex(p => p.id === photoId);
                            if (index !== -1) {
                                photos[index].url = data.data.url;
                                photos[index].isUploading = false;
                                photos[index].imgbbUrl = data.data.url;
                                photos[index].imgbbDeleteUrl = data.data.delete_url;
                                
                                await savePhotos();
                                updateAlbumDisplay();
                                updatePhotoCount();
                                showNotification('✅ Fotoğraf buluta kaydedildi!');
                            }
                        } else {
                            throw new Error(data.error?.message || 'Yükleme başarısız');
                        }
                    } catch (error) {
                        console.error('ImgBB hatası:', error);
                        const index = photos.findIndex(p => p.id === photoId);
                        if (index !== -1) {
                            photos[index].isUploading = false;
                            photos[index].uploadError = true;
                        }
                        updateAlbumDisplay();
                        showNotification('❌ Bulut yüklemesi başarısız, yerel olarak kaydedildi');
                    }
                };
                reader.readAsDataURL(file);
            }
            
            event.target.value = '';
        }
        
        // =================== MODAL ===================
        function openPhotoModal(index) {
            currentPhotoIndex = index;
            const photo = photos[index];
            const modal = document.getElementById('photo-modal');
            
            document.getElementById('modal-image').src = photo.url;
            document.getElementById('modal-caption').value = photo.caption || '';
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            const modal = document.getElementById('photo-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            currentPhotoIndex = -1;
        }
        
        async function savePhotoDetails() {
            if (currentPhotoIndex < 0) return;
            
            const caption = document.getElementById('modal-caption').value.trim();
            photos[currentPhotoIndex].caption = caption || 'Anılarımız 💕';
            photos[currentPhotoIndex].updatedAt = new Date().toISOString();
            
            await savePhotos();
            updateAlbumDisplay();
            closeModal();
            showNotification('✅ Açıklama kaydedildi!');
        }
        
        // =================== DELETE ===================
        async function deletePhoto(event, index) {
            event.stopPropagation();
            
            if (!confirm('Bu fotoğrafı silmek istediğinize emin misiniz?')) return;
            
            photos.splice(index, 1);
            await savePhotos();
            updateAlbumDisplay();
            updatePhotoCount();
            showNotification('🗑️ Fotoğraf silindi');
        }
        
        // =================== NOTIFICATION ===================
        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.classList.add('show');
            
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }
        
        // =================== INIT ===================
        document.addEventListener('DOMContentLoaded', () => {
            loadPhotos();
            loadActivityData();
            
            // Aktivite takibi
            setInterval(trackActivity, 60000); // Her dakika
            
            // Sayfa kapanırken kaydet
            window.addEventListener('beforeunload', () => {
                saveActivityData();
            });
        });
        
        // Modal dışına tıklama
        document.getElementById('photo-modal').addEventListener('click', (e) => {
            if (e.target.id === 'photo-modal') closeModal();
        });
        
        // ESC tuşu
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
